services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ofp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ofp
    volumes:
      - ../data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofp -d ofp"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
      ALLOW_SCHEMA_PUSH: ${ALLOW_SCHEMA_PUSH:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        test "$${ALLOW_SCHEMA_PUSH}" = "true" || {
          echo "Refusing production schema push. Review the generated schema change and explicitly authorize it." >&2
          exit 1
        }
        pnpm --filter @nnact/db migrate
        pnpm --filter @nnact/db schema:parity
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set comma-separated HTTPS web origins (e.g. https://pro.nnact.com)}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set the staff web origin, e.g. https://pro.nnact.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the public API origin, e.g. https://api.pro.nnact.com}
      TRUST_PROXY: "true"
      NNPALLOW_PUBLIC_REGISTRATION: ${NNPALLOW_PUBLIC_REGISTRATION:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NNPUPLOAD_DIR: /uploads
      NNPUPLOAD_MAX_BYTES: ${NNPUPLOAD_MAX_BYTES:-26214400}
      NNPHEALTH_PROBE_TIMEOUT_MS: ${NNPHEALTH_PROBE_TIMEOUT_MS:-2000}
      NNPMAINTENANCE_FILE: /var/lib/nnactpro-ops/state/maintenance.json
    volumes:
      - ../data/uploads:/uploads
      - operations_state:/var/lib/nnactpro-ops/state:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the public HTTPS origin; the client appends /api}
    environment:
      NNPSPONSOR_ENABLED: ${NNPSPONSOR_ENABLED:-false}
      NNPSPONSOR_NAME: ${NNPSPONSOR_NAME:-}
      NNPSPONSOR_MESSAGE: ${NNPSPONSOR_MESSAGE:-}
      NNPSPONSOR_URL: ${NNPSPONSOR_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
      REDIS_URL: redis://redis:6379
      NTFY_URL: ${NTFY_URL:-}
      NNPMAINTENANCE_FILE: /var/lib/nnactpro-ops/state/maintenance.json
      WORKER_STATUS_PORT: 3020
    expose:
      - "3020"
    volumes:
      - operations_state:/var/lib/nnactpro-ops/state:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      NNPSITE_ADDRESS: ${NNPSITE_ADDRESS:?Set the staff web domain, e.g. pro.nnact.com}
      NNPAPI_ADDRESS: ${NNPAPI_ADDRESS:?Set the API domain, e.g. api.pro.nnact.com}
      NNPMARKETING_ADDRESS: ${NNPMARKETING_ADDRESS:?Set the marketing apex domain, e.g. nnact.com}
      NNPMARKETING_WWW: ${NNPMARKETING_WWW:-www.nnact.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ../landing:/srv/landing:ro
      - ${NNPMARKETING_ROOT:-../data/marketing/dist}:/srv/marketing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  operations_state:
    name: ${NNPOPERATIONS_STATE_VOLUME:-openfieldpro_operations_state}
  caddy_data:
  caddy_config:

networks:
  default:
    name: ${NNPINTERNAL_NETWORK:-openfieldpro_internal}
