name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nnact-pro-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout marketing site
        uses: actions/checkout@v7
        with:
          repository: Ojage/nnact-webapp
          ssh-key: ${{ secrets.MARKETING_REPO_DEPLOY_KEY }}
          path: marketing-src

      - name: Build marketing site
        working-directory: marketing-src
        env:
          VITE_API_URL: ${{ vars.MARKETING_API_URL }}
          VITE_SITE_URL: ${{ vars.MARKETING_SITE_URL }}
        run: |
          npm ci
          npm run build

      - name: Sync marketing dist to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/data/marketing/dist'"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            marketing-src/dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/data/marketing/dist/"

      - name: Write production environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NNACT_PRO_ENV: ${{ secrets.NNACT_PRO_ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NNACT_PRO_ENV" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/.env'"

      - name: Pull and deploy on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_USER}@${DEPLOY_HOST}"
          OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          # Start the long deploy detached on the VPS so a dropped SSH
          # connection cannot abort the build; the runner polls instead.
          # Clear stale deploy state first: deploy-status.sh reads /tmp/ci-deploy.*,
          # so a failed start must not fall back to a previous run's "success".
          ssh "${OPTS[@]}" "$HOST" "cd '${DEPLOY_PATH}' && rm -f /tmp/ci-deploy.exit /tmp/ci-deploy.log && git fetch --quiet origin main && git reset --hard --quiet origin/main && bash scripts/start-deploy.sh" || true
          for i in $(seq 1 300); do
            sleep 20
            OUT=$(ssh "${OPTS[@]}" "$HOST" "cd '${DEPLOY_PATH}' && bash scripts/deploy-status.sh" 2>/dev/null || true)
            if [ "$OUT" = "RUNNING" ]; then
              echo "[$(date -u +%H:%M:%S)] deploy running..."
              continue
            fi
            break
          done
          echo "=== deploy log ==="
          printf '%s\n' "$OUT"
          if [ "$OUT" = "STOPPED_WITHOUT_EXIT" ]; then
            echo "deploy did not finish within the poll window" >&2
            exit 1
          fi
          CODE=$(printf '%s\n' "$OUT" | sed -n 's/^EXIT_CODE=\([0-9][0-9]*\)$/\1/p' | tail -1)
          CODE=${CODE:-1}
          echo "=== exit code: $CODE ==="

          # Ultimate guard against silent failed deploys: the VPS must be at a
          # HEAD containing the commit that triggered this run. A fetch or
          # start failure that never surfaced an exit code would otherwise
          # leave production on an older commit while the run shows green.
          DEPLOYED_SHA=$(ssh "${OPTS[@]}" "$HOST" "git -C '${DEPLOY_PATH}' rev-parse HEAD")
          if ! ssh "${OPTS[@]}" "$HOST" "git -C '${DEPLOY_PATH}' merge-base --is-ancestor '${GITHUB_SHA}' HEAD"; then
            echo "deployed HEAD ${DEPLOYED_SHA} does not contain ${GITHUB_SHA}; deploy did not reach production" >&2
            exit 1
          fi
          echo "deploy verified: ${GITHUB_SHA} is in ${DEPLOYED_SHA}"

          exit "$CODE"
