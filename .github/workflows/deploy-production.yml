name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nnact-pro-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout marketing site
        uses: actions/checkout@v4
        with:
          repository: Ojage/nnact-webapp
          ssh-key: ${{ secrets.MARKETING_REPO_DEPLOY_KEY }}
          path: marketing-src

      - name: Build marketing site
        working-directory: marketing-src
        run: |
          npm ci
          npm run build

      - name: Sync marketing dist to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/data/marketing/dist'"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            marketing-src/dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/data/marketing/dist/"

      - name: Write production environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NNACT_PRO_ENV: ${{ secrets.NNACT_PRO_ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NNACT_PRO_ENV" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/.env'"

      - name: Pull and deploy on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_USER}@${DEPLOY_HOST}"
          OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          # Run the long deploy detached on the VPS so a dropped SSH connection
          # cannot abort the build; the runner polls for completion instead.
          ssh "${OPTS[@]}" "$HOST" \
            "set +e; pkill -f 'ci-deploy.sh' 2>/dev/null; : > /tmp/ci-deploy.log; rm -f /tmp/ci-deploy.exit; nohup bash -lc 'cd \"${DEPLOY_PATH}\" && MARKETING_SKIP_BUILD=true bash scripts/ci-deploy.sh > /tmp/ci-deploy.log 2>&1; echo \$? > /tmp/ci-deploy.exit' >/dev/null 2>&1 & echo \"deploy started pid \$!\""
          for i in $(seq 1 300); do
            sleep 20
            if ssh "${OPTS[@]}" "$HOST" "pgrep -f 'ci-deploy.sh' >/dev/null" && ssh "${OPTS[@]}" "$HOST" "test ! -f /tmp/ci-deploy.exit"; then
              echo "[$(date -u +%H:%M:%S)] deploy running..."
            else
              echo "=== deploy log ==="
              ssh "${OPTS[@]}" "$HOST" "cat /tmp/ci-deploy.log 2>/dev/null || true"
              CODE=$(ssh "${OPTS[@]}" "$HOST" "cat /tmp/ci-deploy.exit 2>/dev/null || echo 1")
              echo "=== exit code: $CODE ==="
              exit "$CODE"
            fi
          done
          echo "deploy did not finish within the poll window" >&2
          exit 1
